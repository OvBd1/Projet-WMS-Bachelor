# Overrides de développement — chargé automatiquement par Docker Compose
services:
  backend:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes:
      - ./backend/src:/var/www/html/src
      - ./backend/config:/var/www/html/config
      - ./backend/migrations:/var/www/html/migrations
      - ./backend/docker/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini
      - uploads:/var/www/html/public/uploads

  frontend:
    build:
      target: dev
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 1000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"

volumes:
  node_modules:
