# Mode DEV (hot-reload) — chargé AUTOMATIQUEMENT par `docker compose up`.
#
# - backend : code monté en volume, APP_ENV=dev, cache/vendor en volumes nommés
#             (pas de rebuild d'image quand tu modifies un fichier PHP).
# - frontend : `ng serve` avec HMR dans un conteneur Node, proxifié par nginx.
# - nginx : config dev qui proxifie `/` vers ng serve (au lieu du build statique).
#
# Tout reste accessible sur http://localhost:${HTTP_PORT} (défaut 8080).

services:
  php:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes:
      - ./backend:/var/www/html
      # Volumes nommés pour ne PAS écraser vendor/var avec le host (perfs + perms Windows)
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
      - uploads:/var/www/html/public/uploads
      - jwt_keys:/var/www/html/config/jwt

  web:
    volumes:
      - ./frontend/docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - php
      - frontend

  frontend:
    image: node:22-alpine
    working_dir: /app
    # `npm ci` (ne modifie pas package-lock.json) uniquement si le volume node_modules
    # est vide ; sinon on démarre directement ng serve (redémarrages rapides).
    command: sh -c "[ -d node_modules/@angular/core ] || npm ci; npm start -- --host 0.0.0.0 --poll 1000"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "4200"
    restart: unless-stopped

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
