<div class="layout">
  <header class="navbar">
    <!-- Brand -->
    <a class="navbar-brand" routerLink="/dashboard">
      <div class="navbar-brand-icon">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="6" height="6" rx="1"/>
          <rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/>
          <rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
      </div>
      <span class="navbar-brand-name">LogiTrack</span>
    </a>

    <!-- Nav -->
    <nav class="navbar-nav">

      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Tableau de bord</a>

      <a class="nav-link" routerLink="/receptions" routerLinkActive="active">Réceptions</a>

      <a class="nav-link" routerLink="/commandes" routerLinkActive="active">Commandes</a>

      <!-- Stock -->
      <div class="nav-item" [class.active]="isGroupActive(['stocks','transferts'])">
        <span class="nav-trigger">
          Stock
          <svg class="nav-chevron" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </span>
        <div class="nav-dropdown">
          <a routerLink="/stocks" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"/><path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
            Stocks
          </a>
          <a routerLink="/transferts" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M8 5a1 1 0 100 2h5.586l-1.293 1.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L13.586 5H8zM12 15a1 1 0 100-2H6.414l1.293-1.293a1 1 0 10-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L6.414 15H12z"/></svg>
            Transferts
          </a>
        </div>
      </div>

      <!-- Articles -->
      <div class="nav-item" [class.active]="isGroupActive(['articles','types-conditionnement'])">
        <span class="nav-trigger">
          Articles
          <svg class="nav-chevron" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </span>
        <div class="nav-dropdown">
          <a routerLink="/articles" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1zm1 4a1 1 0 000 2h6a1 1 0 000-2H4z"/></svg>
            Articles
          </a>
          <a routerLink="/types-conditionnement" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zm-2 4a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
            Types de conditionnement
          </a>
        </div>
      </div>

      <a class="nav-link" routerLink="/tiers" routerLinkActive="active">Tiers</a>

      <!-- Emplacements -->
      <div class="nav-item" [class.active]="isGroupActive(['emplacements','types-emplacement'])">
        <span class="nav-trigger">
          Emplacements
          <svg class="nav-chevron" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </span>
        <div class="nav-dropdown">
          <a routerLink="/emplacements" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
            Emplacements
          </a>
          <a routerLink="/types-emplacement" routerLinkActive="is-active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zm-2 4a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
            Types d'emplacement
          </a>
        </div>
      </div>

    </nav>

    <!-- Right actions -->
    <div class="navbar-right">
      <div class="navbar-search">
        <span class="navbar-search-icon">&#128269;</span>
        <input type="text" placeholder="Rechercher...">
      </div>

      <button class="navbar-bell" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>

      <div class="navbar-user">
        <div class="navbar-user-avatar">{{ auth.getUserInitials() }}</div>
        <span class="navbar-user-name">{{ auth.getUserEmail() }}</span>
      </div>

      <button class="navbar-logout" (click)="logout()">Déconnexion</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
