# nginx PROD : sert le build Angular statique + proxifie /api vers PHP-FPM
# et sert les images uploadées depuis le volume partagé.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # --- API Symfony (PHP-FPM) ---
    location /api {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # --- Images uploadées (servies directement depuis le volume) ---
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # --- SPA Angular (fallback index.html pour le routing client) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques : cache long
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
}
