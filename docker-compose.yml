services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:80"
    environment:
      APP_ENV: prod
      APP_SECRET: 3f8a2b1c9d4e7f0a6b5c2d1e8f3a9b4c
      DATABASE_URL: "mysql://root:root@host.docker.internal:3306/wms?serverVersion=8.0&charset=utf8mb4"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: "146c79070d77a31c2456607b9a90790cb448b9000452b3a3250f8a0897c1c586"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/var/www/html/public/uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

volumes:
  uploads:
